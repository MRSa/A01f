plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

//  ----- バージョン定義 -----
def navigation_version = '2.9.5'
def camerax_version = "1.5.0"
def activity_version = "1.11.0"

android {
    compileSdk 36

    defaultConfig {
        applicationId "net.osdn.gokigen.objectdetection.a01f"
        minSdk 24
        targetSdk 36
        versionCode 80006
        versionName "0.8.6"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose = true
    }
    composeOptions {
        // Kotlin 2.2.20 に対応する Compose Compiler のバージョンを指定
        // (公式ドキュメントで最新の互換バージョンを確認する)
        // https://developer.android.com/jetpack/androidx/releases/compose-kotlin
        kotlinCompilerExtensionVersion = "1.5.11" //  Kotlin 2.2.20 に対応するバージョン
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    androidResources {
        noCompress += "tflite"
    }
    namespace 'net.osdn.gokigen.objectdetection.a01f'
}

dependencies {
    // Jetpack Compose BOM を使用してバージョン管理を簡素化
    // 最新のBOMバージョンを確認　: https://developer.android.com/jetpack/compose/bom/bom-mapping
    def composeBom = platform('androidx.compose:compose-bom:2025.09.01') // 例: 最新のBOMバージョン
    implementation composeBom
    androidTestImplementation composeBom // テスト用の依存関係にもBOMを適用

    // 個別のバージョン指定はBOMで行うので不要
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling' // プレビューなどに必要
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.runtime:runtime-livedata'

    // Navigation Compose
    implementation "androidx.navigation:navigation-compose:$navigation_version"

    // その他の依存関係
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "androidx.activity:activity-ktx:$activity_version"
    implementation "androidx.core:core-splashscreen:1.0.1"

    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation "androidx.datastore:datastore-preferences:1.1.7"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'

    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-extensions:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation 'com.google.mediapipe:tasks-core:0.10.29'
    implementation 'com.google.mediapipe:tasks-vision:0.10.29'
}
